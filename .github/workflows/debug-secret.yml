name: Quick Debug Secret

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Create and show ecosystem config
        run: |
          # Создаём файл из секрета
          cat > /tmp/ecosystem-content.js << 'EOF'
          ${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}
          EOF
          
          # Показываем информацию
          echo "📄 Файл создан: /tmp/ecosystem-content.js"
          echo "📏 Размер: $(wc -c < /tmp/ecosystem-content.js) байт"
          echo "📈 Строк: $(wc -l < /tmp/ecosystem-content.js)"
          echo ""
          echo "🔍 Содержимое:"
          echo "========================================"
          cat /tmp/ecosystem-content.js
          echo "========================================"
          
      - name: Save as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-secret-content
          path: /tmp/ecosystem-content.js
