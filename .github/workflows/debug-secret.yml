name: Debug Secret Content

on:
  workflow_dispatch:  # Запускается вручную

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show ECOSYSTEM_CONFIG_CONTENT
        run: |
          echo "Содержимое ECOSYSTEM_CONFIG_CONTENT:"
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}"
          
          # Сохраним в файл для проверки
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" > ecosystem-debug.js
          
          echo "=== Файл сохранён как ecosystem-debug.js ==="
          cat ecosystem-debug.js
          
      - name: Upload debug file
        uses: actions/upload-artifact@v3
        with:
          name: ecosystem-config
          path: ecosystem-debug.js
