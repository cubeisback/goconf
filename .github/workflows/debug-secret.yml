name: Check deployment access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-access-check
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
      SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
      ENV_CONTENT: ${{ secrets.ENV_DEV_CONTENT }}
      TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and SSH access
        shell: bash
        run: |
          set -euo pipefail
          test "$SERVER_IP" = "141.98.190.155"
          test "$SERVER_USER" = "thunder"
          test -n "$PRIVATE_KEY"
          test -n "$ENV_CONTENT"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/goconf_key
          ssh-keygen -y -P '' -f ~/.ssh/goconf_key > /dev/null
          printf '%s\n' '141.98.190.155 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICq0yEw3stYLxE3k34QkhiQ1tF6IHzlZGVZGKReJtL/b' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host goconf-deploy
            HostName $SERVER_IP
            User $SERVER_USER
            IdentityFile ~/.ssh/goconf_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF
          ssh goconf-deploy 'test "$(id -un)" = thunder; command -v node npm pm2 rsync flock'
