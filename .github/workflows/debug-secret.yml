name: Debug All Secrets

on:
  workflow_dispatch:  # Только ручной запуск

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Debug all secrets safely
        run: |
          echo "🔐 ДЕБАГ ВСЕХ СЕКРЕТОВ"
          echo "========================================"
          echo ""
          
          # 1. ECOSYSTEM_CONFIG_CONTENT
          echo "📄 ECOSYSTEM_CONFIG_CONTENT:"
          echo "----------------------------------------"
          if [ -n "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" ]; then
            echo "Длина: ${#ECOSYSTEM_CONFIG_CONTENT} символов"
            echo ""
            echo "Первые 500 символов:"
            echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" | head -c 500
            echo ""
            echo "..."
            echo ""
            echo "Последние 500 символов:"
            echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" | tail -c 500
          else
            echo "⚠️  Секрет пуст или не установлен"
          fi
          echo ""
          
          # 2. ENV_DEV_CONTENT
          echo "📄 ENV_DEV_CONTENT:"
          echo "----------------------------------------"
          if [ -n "${{ secrets.ENV_DEV_CONTENT }}" ]; then
            echo "Длина: ${#ENV_DEV_CONTENT} символов"
            echo ""
            echo "Содержимое (первые 1000 символов):"
            echo "${{ secrets.ENV_DEV_CONTENT }}" | head -c 1000
          else
            echo "⚠️  Секрет пуст или не установлен"
          fi
          echo ""
          
          # 3. ENV_PRODUCTION_CONTENT
          echo "📄 ENV_PRODUCTION_CONTENT:"
          echo "----------------------------------------"
          if [ -n "${{ secrets.ENV_PRODUCTION_CONTENT }}" ]; then
            echo "Длина: ${#ENV_PRODUCTION_CONTENT} символов"
            echo ""
            echo "Содержимое (первые 1000 символов):"
            echo "${{ secrets.ENV_PRODUCTION_CONTENT }}" | head -c 1000
          else
            echo "⚠️  Секрет пуст или не установлен"
          fi
          echo ""
          
          # 4. PRIVATE_KEY (показываем только информацию, не сам ключ)
          echo "🔑 PRIVATE_KEY:"
          echo "----------------------------------------"
          if [ -n "${{ secrets.PRIVATE_KEY }}" ]; then
            echo "Длина: ${#PRIVATE_KEY} символов"
            echo ""
            echo "Первые 50 символов (для идентификации):"
            echo "${{ secrets.PRIVATE_KEY }}" | head -c 50
            echo "..."
            echo ""
            echo "Тип ключа:"
            echo "${{ secrets.PRIVATE_KEY }}" | head -1 | grep -q "BEGIN RSA" && echo "RSA ключ"
            echo "${{ secrets.PRIVATE_KEY }}" | head -1 | grep -q "BEGIN OPENSSH" && echo "OPENSSH ключ"
            echo "${{ secrets.PRIVATE_KEY }}" | head -1 | grep -q "BEGIN EC" && echo "EC ключ"
          else
            echo "⚠️  Секрет пуст или не установлен"
          fi
          echo ""
          
          # 5. PRIVATE_KEY_DEV
          echo "🔑 PRIVATE_KEY_DEV:"
          echo "----------------------------------------"
          if [ -n "${{ secrets.PRIVATE_KEY_DEV }}" ]; then
            echo "Длина: ${#PRIVATE_KEY_DEV} символов"
            echo ""
            echo "Первые 50 символов:"
            echo "${{ secrets.PRIVATE_KEY_DEV }}" | head -c 50
            echo "..."
          else
            echo "⚠️  Секрет пуст или не установлен"
          fi
          echo ""
          
          # 6. SERVER_IP
          echo "🌐 SERVER_IP:"
          echo "----------------------------------------"
          echo "${{ secrets.SERVER_IP }}"
          echo ""
          
          # 7. SERVER_IP_DEV
          echo "🌐 SERVER_IP_DEV:"
          echo "----------------------------------------"
          echo "${{ secrets.SERVER_IP_DEV }}"
          echo ""
          
          # 8. SERVER_USER
          echo "👤 SERVER_USER:"
          echo "----------------------------------------"
          echo "${{ secrets.SERVER_USER }}"
          echo ""
          
          # 9. SERVER_USER_DEV
          echo "👤 SERVER_USER_DEV:"
          echo "----------------------------------------"
          echo "${{ secrets.SERVER_USER_DEV }}"
          echo ""
          
          echo "========================================"
          echo "✅ Проверка завершена"
          
      - name: Save all secrets to files (без приватных ключей)
        run: |
          # Сохраняем безопасные секреты в файлы
          mkdir -p /tmp/secrets
          
          # ECOSYSTEM_CONFIG_CONTENT
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" > /tmp/secrets/ecosystem.config.js
          
          # ENV файлы
          echo "${{ secrets.ENV_DEV_CONTENT }}" > /tmp/secrets/.env.dev
          echo "${{ secrets.ENV_PRODUCTION_CONTENT }}" > /tmp/secrets/.env.production
          
          # Серверная информация
          echo "SERVER_IP=${{ secrets.SERVER_IP }}" > /tmp/secrets/servers.info
          echo "SERVER_IP_DEV=${{ secrets.SERVER_IP_DEV }}" >> /tmp/secrets/servers.info
          echo "SERVER_USER=${{ secrets.SERVER_USER }}" >> /tmp/secrets/servers.info
          echo "SERVER_USER_DEV=${{ secrets.SERVER_USER_DEV }}" >> /tmp/secrets/servers.info
          
          echo "Файлы сохранены в /tmp/secrets/"
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-secrets-debug
          path: /tmp/secrets/
