name: Deploy goconf Next.js App (Production)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.production
        run: |
          echo "${{ secrets.ENV_PRODUCTION_CONTENT }}" > .env.production

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload project files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".next" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:/home/thunder/web/goconf.ru/app/

      - name: Deploy Production
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /home/thunder/web/goconf.ru/app

            echo "=== STOPPING OLD PROCESSES ==="
            # Без sudo - используем pkill и fuser от пользователя
            pkill -f "node.*3001" 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            sleep 2
            
            echo "=== CLEANING ==="
            # Удаляем кэш Server Actions
            rm -rf .next/standalone .next/server/actions 2>/dev/null || true
            rm -rf .next node_modules/.cache npm-debug.log* 2>/dev/null || true
            
            echo "=== INSTALLING DEPENDENCIES ==="
            NODE_OPTIONS="--max-old-space-size=1024" npm install --legacy-peer-deps
            
            echo "=== BUILDING PRODUCTION ==="
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            
            echo "=== RESTARTING PM2 ==="
            pm2 delete goconf-prod 2>/dev/null || true
            sleep 1
            
            # Простой запуск без сложных опций
            NODE_ENV=production PORT=3001 pm2 start npm --name "goconf-prod" -- run start
            
            pm2 save --force
            
            echo "=== POST-DEPLOYMENT CHECK ==="
            sleep 5
            
            echo "PM2 Status:"
            pm2 list
            
            echo "Application check:"
            # Даем больше времени и проверяем несколько раз
            for i in {1..3}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 --max-time 10 | grep -q "200\|30"; then
                echo "✅ Production application is running on port 3001"
                
                # Проверяем статические файлы
                echo "Checking static files..."
                STATIC_FILE=$(find .next/static/chunks -name "main-app-*.js" | head -1 | xargs basename)
                if curl -s -o /dev/null -w "_next/static file: %{http_code}\n" http://localhost:3001/_next/static/chunks/$STATIC_FILE --max-time 5 | grep -q "200"; then
                  echo "✅ Static files are accessible"
                  echo "✅ Production deployment completed successfully"
                  exit 0  # Явный успешный выход
                fi
              fi
              sleep 2
            done
            
            echo "⚠️ Production application not responding after retries"
            echo "Checking logs..."
            pm2 logs goconf-prod --lines 30
            
            # Если не запустилось, пробуем альтернативный метод
            echo "Trying alternative startup method..."
            pm2 delete goconf-prod 2>/dev/null || true
            pkill -f "node.*3001" 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            sleep 2
            
            cd /home/thunder/web/goconf.ru/app
            NODE_ENV=production PORT=3001 node .next/standalone/server.js > /tmp/next.log 2>&1 &
            sleep 3
            
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 --max-time 5 | grep -q "200\|30"; then
              echo "✅ Application started via standalone server"
              pm2 start "node .next/standalone/server.js" --name "goconf-prod" --interpreter="node" --env NODE_ENV=production,PORT=3001
              pm2 save --force
              echo "✅ Production deployment completed via alternative method"
              exit 0
            else
              echo "❌ Failed to start application"
              cat /tmp/next.log
              exit 1
            fi
          EOF