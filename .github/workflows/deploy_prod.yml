name: Deploy goconf Next.js App (Production)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.production
        run: |
          echo "${{ secrets.ENV_PRODUCTION_CONTENT }}" > .env.production

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload project files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".next" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:/home/thunder/web/goconf.ru/app/

      - name: Deploy Production
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /home/thunder/web/goconf.ru/app

            echo "=== STOPPING OLD PROCESSES ==="
            # Освобождаем порты
            sudo fuser -k 3000/tcp 2>/dev/null || true
            sudo fuser -k 3001/tcp 2>/dev/null || true
            sudo fuser -k 3002/tcp 2>/dev/null || true
            
            echo "=== CLEANING ==="
            rm -rf .next node_modules/.cache npm-debug.log* 2>/dev/null || true
            
            echo "=== INSTALLING DEPENDENCIES ==="
            NODE_OPTIONS="--max-old-space-size=1024" npm install --legacy-peer-deps
            
            echo "=== BUILDING PRODUCTION ==="
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            
            echo "=== RESTARTING PM2 ==="
            pm2 delete goconf-prod 2>/dev/null || true
            
            # Запускаем правильно
            NODE_ENV=production PORT=3002 pm2 start npm --name "goconf-prod" -- run start
            
            pm2 save --force
            
            echo "=== POST-DEPLOYMENT CHECK ==="
            sleep 5
            
            echo "PM2 Status:"
            pm2 list
            
            echo "Application check:"
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3002 | grep -q "200\|30"; then
              echo "✅ Production application is running on port 3002"
              
              # Проверяем статические файлы
              echo "Checking static files..."
              STATIC_FILE=$(find .next/static -name "*.js" | head -1 | xargs basename)
              if curl -s -o /dev/null -w "_next/static file: %{http_code}\n" http://localhost:3002/_next/static/chunks/$STATIC_FILE | grep -q "200"; then
                echo "✅ Static files are accessible"
              else
                echo "⚠️ Static files may have issues"
              fi
            else
              echo "⚠️ Production application not responding"
              pm2 logs goconf-prod --lines 20
            fi
            
            echo "✅ Production deployment completed"
          EOF