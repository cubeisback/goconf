name: Deploy frontend (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
      SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
      ENV_CONTENT: ${{ secrets.ENV_DEV_CONTENT }}
      TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and SSH access
        shell: bash
        run: |
          set -euo pipefail
          test "$SERVER_IP" = "141.98.190.155"
          test "$SERVER_USER" = "thunder"
          test -n "$PRIVATE_KEY"
          test -n "$ENV_CONTENT"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/goconf_key
          ssh-keygen -y -P '' -f ~/.ssh/goconf_key > /dev/null
          printf '%s\n' '141.98.190.155 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICq0yEw3stYLxE3k34QkhiQ1tF6IHzlZGVZGKReJtL/b' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host goconf-deploy
            HostName $SERVER_IP
            User $SERVER_USER
            IdentityFile ~/.ssh/goconf_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF
          ssh goconf-deploy 'test "$(id -un)" = thunder; command -v node npm pm2 rsync flock'
      - name: Upload isolated release
        shell: bash
        run: |
          set -euo pipefail
          domain=goconf.ru
          if [ "$TARGET" = dev ]; then domain=dev.goconf.ru; fi
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release="/home/thunder/web/$domain/releases/$release_id"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frontend"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/frontend"
          find "$RUNNER_TEMP/frontend" -maxdepth 1 -name '.env*' -type f -delete
          printf '%s\n' "$ENV_CONTENT" > "$RUNNER_TEMP/frontend/.env.production"
          ssh goconf-deploy "mkdir -p '$release'"
          rsync -az "$RUNNER_TEMP/frontend/" "goconf-deploy:$release/"
      - name: Build, check and activate frontend
        shell: bash
        run: |
          set -euo pipefail
          ssh goconf-deploy "bash '$RELEASE/scripts/deploy-frontend.sh' '$TARGET' '$RELEASE_ID'"
