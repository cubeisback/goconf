name: Deploy goconf Next.js App (Dev)

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.dev and ecosystem.config.js
        run: |
          echo "${{ secrets.ENV_DEV_CONTENT }}" > .env.dev
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" > ecosystem.config.js

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload project files (excluding .git and node_modules)
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:/home/thunder/web/dev.goconf.ru/app/

      - name: Install, Build and Restart PM2
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /home/thunder/web/dev.goconf.ru/app
            
            echo "=== CHECKING SYSTEM ==="
            echo "Current swappiness:"
            cat /proc/sys/vm/swappiness
            
            echo "Memory status:"
            free -h
            
            echo "=== CLEANING CACHE ==="
            npm cache clean --force
            
            echo "=== INSTALLING DEPENDENCIES ==="
            # Используем меньше памяти
            npm install --verbose 2>&1 | tail -50
            
            echo "=== BUILDING PROJECT ==="
            rm -rf .next
            cp .env.dev .env.production
            npm run build
            
            echo "=== RESTARTING PM2 ==="
            # Освобождаем порт без sudo
            fuser -k 3001/tcp 2>/dev/null || true
            
            pm2 delete goconf-dev 2>/dev/null || true
            pm2 start npm --name "goconf-dev" -- start --max-memory-restart 500M
            pm2 save
            
            echo "✅ Dev deployment completed"
          EOF
