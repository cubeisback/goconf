name: GoConf

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Укажите нужную версию Node.js

    - name: Install dependencies
      run: npm install

    - name: Build the app
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build
        path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Selectel
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      run: |
        # Создаем директорию .ssh, если она не существует
        mkdir -p ~/.ssh
    
        # Создаем файл с приватным ключом
        echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
        chmod 600 ~/.ssh/goconf_key
    
        # Проверяем права доступа
        ls -l ~/.ssh
        
        # Добавляем сервер в known_hosts (если еще не добавлен)
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    
        # Удаление старой версии
        ssh -i ~/.ssh/goconf_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "rm -rf /var/www/goconf/*"
    
        # Копирование новой версии
        scp -i ~/.ssh/goconf_key -r ./build/* $SERVER_USER@$SERVER_IP:/var/www/goconf/
    
    - name: Deploy to production (example)
      run: |
        echo "Deploying to production server"
