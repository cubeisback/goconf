name: GoConf

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Укажите нужную версию Node.js

    - name: Install dependencies
      run: npm install

    - name: Build the app
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build
        path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/goconf_key
        chmod 600 ~/.ssh/goconf_key
    
        # Проверяем права доступа
        ls -l ~/.ssh
    
        # Добавляем сервер в known_hosts
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts || exit 1
    
