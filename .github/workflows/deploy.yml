name: Deploy goconf Next.js App (Dev)

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.dev
        run: |
          echo "${{ secrets.ENV_DEV_CONTENT }}" > .env.dev

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload project files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".next" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:/home/thunder/web/dev.goconf.ru/app/

      - name: Install, Build and Restart PM2
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /home/thunder/web/dev.goconf.ru/app
            
            echo "=== STOPPING DEV PROCESS ONLY ==="
            # НЕ трогаем 3001 — там prod
            sudo fuser -k 3000/tcp 2>/dev/null || true
            
            echo "=== CLEANING ==="
            rm -rf .next node_modules/.cache npm-debug.log* 2>/dev/null || true
            # rsync без --delete оставляет старый файл — он перебивает app/robots.txt
            rm -f public/robots.txt
            
            echo "=== INSTALLING DEPENDENCIES ==="
            NODE_OPTIONS="--max-old-space-size=1024" npm install --legacy-peer-deps
            
            echo "=== BUILDING PROJECT ==="
            if [ ! -f .env.dev ]; then
              echo "ERROR: .env.dev missing"
              exit 1
            fi
            if ! grep -q 'NEXT_PUBLIC_VERSION=dev' .env.dev; then
              echo "ERROR: .env.dev must contain NEXT_PUBLIC_VERSION=dev"
              exit 1
            fi
            cp .env.dev .env.production
            echo "Using .env.dev for build (NEXT_PUBLIC_VERSION=dev)"
            grep NEXT_PUBLIC_VERSION .env.dev || true
            
            ENV_FILE=.env.dev NODE_OPTIONS="--max-old-space-size=1024" npm run build
            
            echo "=== RESTARTING PM2 ==="
            pm2 delete goconf-dev 2>/dev/null || true
            
            # Dev всегда на 3000
            NODE_ENV=production PORT=3000 pm2 start npm --name "goconf-dev" -- run start
            
            pm2 save --force
            
            echo "=== VERIFICATION ==="
            sleep 3
            pm2 list
            echo "Local headers:"
            curl -sI http://localhost:3000/robots.txt | tr -d '\r' | grep -iE 'HTTP|x-goconf|x-robots' || true
            echo "Public headers (dev.goconf.ru):"
            curl -sI https://dev.goconf.ru/robots.txt | tr -d '\r' | grep -iE 'HTTP|x-goconf|x-robots' || true
            
            echo "✅ Dev deployment completed"
          EOF