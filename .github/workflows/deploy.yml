name: Deploy goconf React App

on:
  push:
    branches:
      - main  # Триггер при пуше в ветку main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Проверка кода
      - name: Checkout code
        uses: actions/checkout@v3

      # Установка Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Установка зависимостей и сборка проекта
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Проверка существования директории build
      - name: Check if build directory exists
        run: |
          ls -l ./build

      # Создаем директорию .ssh, если она не существует
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ls -l ~/.ssh
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      # Удаление старой версии
      - name: Remove old version on server
        run: |
          ssh -i ~/.ssh/goconf_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "rm -rf /var/www/goconf/*"

      # Копирование новой версии
      - name: Deploy new version
        run: |
          scp -i ~/.ssh/goconf_key -r ./build/* $SERVER_USER@$SERVER_IP:/var/www/goconf/
