name: Deploy goconf Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create sensitive config files (.env.dev and ecosystem.config.js)
        run: |
          echo "${{ secrets.ENV_DEV_CONTENT }}" > .env.dev
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" > ecosystem.config.js

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_DEV }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload new project files (excluding .git and node_modules)
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:/home/thunder/web/dev.goconf.ru/app/

      - name: Install, Build and Restart App
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_DEV }}
          SERVER_USER: ${{ secrets.SERVER_USER_DEV }}
        run: |
          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /home/thunder/web/dev.goconf.ru/app
            echo "Installing dependencies..."
            npm install
            echo "Building project..."
            ENV_FILE=.env.dev npm run build
            echo "Restarting PM2 process..."
            pm2 describe goconf-dev > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              pm2 restart goconf-dev
            else
              pm2 start npm --name "goconf-dev" -- start
            fi
            pm2 save
          EOF
