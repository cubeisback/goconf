name: Deploy goconf Next.js App

on:
  push:
    branches:
      - main
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create sensitive config files (.env.production and ecosystem.config.js)
        run: |
          echo "${{ secrets.ENV_PRODUCTION_CONTENT }}" > .env.production
          echo "${{ secrets.ECOSYSTEM_CONFIG_CONTENT }}" > ecosystem.config.js

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/goconf_key
          chmod 600 ~/.ssh/goconf_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Upload new project files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_PATH="/home/thunder/web/dev.goconf.ru/app"
          else
            TARGET_PATH="/home/thunder/web/goconf.ru/app"
          fi
          rsync -avz \
            --exclude=".git" \
            --exclude="node_modules" \
            -e "ssh -i ~/.ssh/goconf_key" ./ \
            $SERVER_USER@$SERVER_IP:$TARGET_PATH/

      - name: Install, Build and Restart App
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_PATH="/home/thunder/web/dev.goconf.ru/app"
            PM2_NAME="goconf-dev"
          else
            TARGET_PATH="/home/thunder/web/goconf.ru/app"
            PM2_NAME="goconf-prod"
          fi

          ssh -i ~/.ssh/goconf_key $SERVER_USER@$SERVER_IP << EOF
            set -e
            cd $TARGET_PATH
            echo "Installing dependencies..."
            npm install
            echo "Building project..."
            npm run build
            echo "Restarting PM2 process..."
            pm2 describe $PM2_NAME > /dev/null 2>&1
            if [ \$? -eq 0 ]; then
              pm2 restart $PM2_NAME
            else
              pm2 start npm --name "$PM2_NAME" -- start
            fi
            pm2 save
          EOF
